[project]
name = "notionlinkrereader"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
notion-link-rereader = "notionlinkrereader.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notionlinkrereader"]
